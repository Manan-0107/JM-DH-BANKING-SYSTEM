<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bankist | Account Features</title>
  <script>
    (function () {
      const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
      if (isLoggedIn) {
        window.location.replace("table-detail.html?table=account");
      } else {
        alert("⚠️ Access Restricted: You need to log in first to access Account features and details.");
        window.location.replace("index.html?loginRequired=true");
      }
    })();
  </script>
</head>
<body>
  <p>Checking authentication...</p>
</body>
</html>
